<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HBD Yanisa 🎂</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden; display:grid; place-items:center;
  background:radial-gradient(circle at 50% 35%,#302d43 0,#181724 48%,#0c0b12 100%);
  color:#fff; font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
.wrap{width:min(94vw,720px);text-align:center;position:relative}
.title{
  margin:0;font-size:clamp(31px,8vw,65px);color:#ff94c9;
  text-shadow:0 0 22px #ff68b177;
  opacity:0;animation:titleIn .8s .15s forwards, titleDance 2.2s 1s ease-in-out infinite;
}
.sub{
  margin:8px 0 0;font-size:clamp(15px,4vw,20px);opacity:0;
  animation:fadeUp .7s .75s forwards, wiggle 2.6s 1.5s ease-in-out infinite;
}
.scene{height:365px;position:relative;margin-top:2px}
.plate{
  position:absolute;left:50%;bottom:35px;width:300px;height:10px;
  transform:translateX(-50%) scaleX(0);border-radius:50%;background:#f6eae5;
  box-shadow:0 8px 20px #0008;animation:plateIn .45s 1.2s forwards;
}
.layer{
  position:absolute;left:50%;transform:translateX(-50%);
  opacity:0;box-shadow:inset 0 -8px 0 #00000013,0 7px 12px #0004;
}
.l1{
  bottom:44px;width:245px;height:67px;border-radius:13px 13px 17px 17px;
  background:
    radial-gradient(circle at 18% 38%,#ffd9e7 0 3px,transparent 4px),
    radial-gradient(circle at 78% 62%,#ffd9e7 0 3px,transparent 4px),
    linear-gradient(180deg,#b96875 0%,#9b5360 52%,#824651 100%);
  border:1px solid #d9909b;
  animation:drop1 .65s 1.6s cubic-bezier(.2,.9,.25,1.25) forwards;
}
.l2{
  bottom:107px;width:205px;height:62px;border-radius:12px 12px 15px 15px;
  background:
    radial-gradient(circle at 24% 62%,#fff0f5 0 2px,transparent 3px),
    radial-gradient(circle at 72% 35%,#fff0f5 0 2px,transparent 3px),
    linear-gradient(180deg,#df8f9f 0%,#c87587 55%,#ad6072 100%);
  border:1px solid #efb1bd;
  animation:drop2 .65s 2.35s cubic-bezier(.2,.9,.25,1.25) forwards;
}
.l3{
  bottom:165px;width:165px;height:58px;border-radius:12px 12px 14px 14px;
  background:
    radial-gradient(circle at 30% 55%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 70% 58%,#fff 0 2px,transparent 3px),
    linear-gradient(180deg,#f2a9b6 0%,#df8799 58%,#c96f82 100%);
  border:1px solid #f7c4ce;
  animation:drop3 .65s 3.1s cubic-bezier(.2,.9,.25,1.25) forwards;
}
.cream{
  position:absolute;left:-4px;right:-4px;top:-10px;height:27px;
  background:linear-gradient(180deg,#fffdfb 0%,#fff1ed 62%,#f8d9dc 100%);
  border-radius:16px 16px 11px 11px;
  box-shadow:0 3px 0 #ffffff77,inset 0 -3px 4px #e9b9c044;
}
.cream:before,.cream:after{content:"";position:absolute;top:12px;background:#fff1e7;border-radius:0 0 12px 12px}
.cream:before{left:25%;width:22px;height:23px}.cream:after{right:20%;width:18px;height:17px}
.candle{
  position:absolute;left:50%;bottom:221px;width:11px;height:57px;opacity:0;
  transform:translate(-50%,-180px) rotate(-12deg);
  border-radius:5px;background:repeating-linear-gradient(45deg,#fff 0 6px,#ff85b9 6px 12px);
  animation:candleDrop .7s 3.9s cubic-bezier(.2,.9,.25,1.25) forwards;
}
.wick{position:absolute;width:2px;height:9px;background:#333;left:4.5px;top:-8px}
.flame{
  position:absolute;left:50%;top:-39px;width:21px;height:31px;opacity:0;
  transform:translateX(-50%) scale(.2);
  border-radius:50% 50% 45% 45%;
  background:radial-gradient(circle at 50% 65%,#fffbd0 0 18%,#ffd65a 35%,#ff8537 62%,transparent 65%);
  filter:drop-shadow(0 0 13px #ffc64f);
  animation:light .35s 4.65s forwards, flameDance .16s 5s infinite alternate;
}
.btn{
  opacity:0;transform:translateY(10px);
  animation:fadeUp .55s 5.15s forwards, buttonBounce 1.6s 5.8s ease-in-out infinite;
  border:0;border-radius:999px;padding:13px 23px;font-size:17px;font-weight:800;
  background:#ff91c7;color:#351626;box-shadow:0 8px 26px #ff6eb755;
}
.message{
  min-height:58px;margin-top:17px;font-size:clamp(19px,5vw,27px);font-weight:750;
  opacity:0;transform:scale(.7) rotate(-2deg);
}
.message.show{animation:messagePop .65s forwards, messageDance 2s .7s ease-in-out infinite}
.float{position:fixed;bottom:-35px;pointer-events:none;animation:floatUp linear forwards}
.spark{position:fixed;pointer-events:none;animation:burst 1.25s ease-out forwards}
body.blown .flame{animation:flameOut .22s forwards}
body.blown .wick:after{content:"";position:absolute;left:-8px;top:-28px;width:18px;height:28px;border-radius:50%;background:#ddd4;filter:blur(5px);animation:smoke 1.7s forwards}

@keyframes titleIn{to{opacity:1}}
@keyframes titleDance{0%,100%{transform:rotate(-1deg) translateY(0) scale(1)}50%{transform:rotate(1deg) translateY(-5px) scale(1.025)}}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-1deg)}75%{transform:rotate(1deg)}}
@keyframes plateIn{to{transform:translateX(-50%) scaleX(1)}}
@keyframes drop1{0%{opacity:0;transform:translate(-50%,-300px) rotate(-7deg)}70%{opacity:1;transform:translate(-50%,8px) rotate(2deg)}100%{opacity:1;transform:translate(-50%,0) rotate(0)}}
@keyframes drop2{0%{opacity:0;transform:translate(-50%,-330px) rotate(8deg)}70%{opacity:1;transform:translate(-50%,7px) rotate(-2deg)}100%{opacity:1;transform:translate(-50%,0)}}
@keyframes drop3{0%{opacity:0;transform:translate(-50%,-350px) rotate(-8deg)}70%{opacity:1;transform:translate(-50%,6px) rotate(2deg)}100%{opacity:1;transform:translate(-50%,0)}}
@keyframes candleDrop{0%{opacity:0;transform:translate(-50%,-180px) rotate(-12deg)}70%{opacity:1;transform:translate(-50%,5px) rotate(4deg)}100%{opacity:1;transform:translate(-50%,0) rotate(0)}}
@keyframes light{to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes flameDance{from{transform:translateX(-50%) rotate(-5deg) scale(.94)}to{transform:translateX(-50%) rotate(5deg) scale(1.08)}}
@keyframes buttonBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.035)}}
@keyframes messagePop{60%{opacity:1;transform:scale(1.08) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes messageDance{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-5px) rotate(.5deg)}}
@keyframes floatUp{to{transform:translateY(-115vh) rotate(360deg);opacity:0}}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(240deg) scale(.2);opacity:0}}
@keyframes flameOut{to{opacity:0;transform:translateX(-50%) scale(.1)}}
@keyframes smoke{to{transform:translateY(-50px) scale(2);opacity:0}}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="title">Happy Birthday Yanisa 🎂</h1>
  <div class="sub">สุขสันต์วันเกิดย้อนหลังนะที่รัก เค้ารักเธอมากๆนะ ❤️</div>

  <div class="scene">
    <div class="plate"></div>
    <div class="layer l1"><div class="cream"></div></div>
    <div class="layer l2"><div class="cream"></div></div>
    <div class="layer l3"><div class="cream"></div></div>
    <div class="candle"><div class="wick"></div><div class="flame"></div></div>
  </div>

  <button class="btn" id="blow">🎂 อธิษฐานก่อนเป่าเทียน</button>
  <div class="message" id="msg">Happy Birthday, Yanisa ❤️<br>ขอให้มีความสุขมาก ๆ ในทุกวันนะ</div>
</main>
<script>
const btn=document.getElementById('blow'),msg=document.getElementById('msg');
let done=false;
function floater(){
 const e=document.createElement('div');e.className='float';
 e.textContent=['💗','❤️','💕','✨','🎈'][Math.floor(Math.random()*5)];
 e.style.left=Math.random()*100+'vw';e.style.fontSize=(15+Math.random()*25)+'px';
 e.style.animationDuration=(3+Math.random()*3)+'s';document.body.appendChild(e);
 setTimeout(()=>e.remove(),6500);
}
function burst(){
 for(let i=0;i<42;i++){
  const e=document.createElement('div');e.className='spark';
  e.textContent=['💗','✨','🎉','🎈','💕'][Math.floor(Math.random()*5)];
  e.style.left='50vw';e.style.top='48vh';e.style.fontSize=(15+Math.random()*18)+'px';
  const a=Math.random()*Math.PI*2,d=90+Math.random()*280;
  e.style.setProperty('--x',Math.cos(a)*d+'px');e.style.setProperty('--y',Math.sin(a)*d+'px');
  document.body.appendChild(e);setTimeout(()=>e.remove(),1400);
 }
}
setInterval(()=>{if(Math.random()>.5)floater()},950);
btn.onclick=()=>{
 if(done){location.reload();return}
 done=true;document.body.classList.add('blown');msg.classList.add('show');
 btn.textContent='💗 ดูอีกครั้ง';burst();
 for(let i=0;i<22;i++)setTimeout(floater,i*100);
};
</script>
</body>
</html>
<style>
.layer:before{
  content:"";
  position:absolute;left:10%;right:10%;bottom:9px;height:8px;
  background:radial-gradient(circle,#ffe4a8 0 2px,transparent 2.8px) 0 0/20px 8px repeat-x;
  opacity:.9;
}
.l3:after{
  content:"🍓";
  position:absolute;left:50%;top:-27px;
  transform:translateX(-50%) rotate(-8deg);
  font-size:23px;
  filter:drop-shadow(0 3px 2px #0002);
}
.plate{
  background:linear-gradient(180deg,#fff,#f1dfe5 70%,#d7bdc7);
  border:1px solid #fff;
  box-shadow:0 8px 22px #0008,0 0 20px #ffb4d322;
}
.candle{
  box-shadow:inset 2px 0 3px #fff8,0 2px 5px #0003;
}
.scene:after{
  content:"";
  position:absolute;z-index:-1;left:50%;bottom:18px;width:330px;height:70px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse,#ff8fbd22 0%,transparent 70%);
  filter:blur(8px);
}
</style>
