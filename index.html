<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>จ๊ะจ๋ากระทงซิ่ง</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071426;color:#fff;font-family:Tahoma,sans-serif;overflow-x:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1}main{max-width:850px;margin:auto;padding:30px 16px;text-align:center}h1{font-size:clamp(28px,5vw,48px);color:#ffe2a0;margin:8px 0;text-shadow:0 0 25px #e9a844}p{color:#c4d6e9;line-height:1.6}.panel{background:#08172cdd;border:1px solid #bfa56a66;border-radius:24px;padding:22px;backdrop-filter:blur(12px);box-shadow:0 15px 60px #0006}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.choice{background:#142940;border:1px solid #ffffff20;border-radius:15px;color:white;padding:8px;cursor:pointer;transition:.2s;font:inherit}.choice:hover,.choice.active{border-color:#ffd780;background:#34404c;transform:translateY(-3px)}.choice svg{width:100%;max-width:125px;display:block;margin:auto}.choice span{font-size:13px}input,textarea{width:100%;background:#071426;border:1px solid #ffffff35;border-radius:12px;padding:13px;color:white;font:inherit;margin:6px 0 12px}label{display:block;text-align:left;color:#ffe2a0;font-size:14px}.primary{border:0;border-radius:40px;padding:15px 35px;background:linear-gradient(110deg,#fff0b2,#d99a38);color:#30200b;font:bold 18px Tahoma;cursor:pointer;box-shadow:0 0 30px #ffca5555}.primary:disabled{opacity:.5;cursor:not-allowed}#preview{width:160px;margin:0 auto}#preview svg{width:100%}#previewName{overflow-wrap:anywhere;color:#ffe2a0}#celebrate{display:none;padding-top:20px;text-shadow:0 2px 12px #000}#celebrate h2{color:#ffe2a0;font-size:clamp(24px,5vw,40px)}#again{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);white-space:nowrap}#finalWish{font-size:clamp(19px,4vw,30px);font-weight:bold;color:#ffe2a0;max-width:650px;margin:24px auto;animation:wishReveal 1.5s ease both}@keyframes wishReveal{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}#wishOut{max-width:90%;margin:auto;overflow-wrap:anywhere}small{letter-spacing:3px;color:#e4bf75}@media(max-width:540px){main{padding:16px 10px}.panel{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.choice svg{max-width:95px}}

@keyframes textEnter {from{opacity:0;translate:0 14px;filter:blur(4px)}to{opacity:1;translate:0 0;filter:blur(0)}}
@keyframes goldGlow {0%,100%{text-shadow:0 0 12px #d99a3866}50%{text-shadow:0 0 28px #ffce75,0 0 48px #d99a3877}}
@keyframes bob {0%,100%{translate:0 0}50%{translate:0 -5px}}
@keyframes shine {0%,100%{box-shadow:0 0 12px #ffca5533}50%{box-shadow:0 0 30px #ffca5588}}
header small,header p,h2,label,input,textarea,.choice span,#previewName,#wishOut,.primary{animation:textEnter .85s both}
h1{animation:textEnter 1s both,goldGlow 3s 1s infinite}
header p{animation-delay:.25s}label{animation-delay:.15s}.choice span{display:block;animation-delay:.2s}.choice svg,#preview svg{animation:bob 3s ease-in-out infinite}.choice.active{box-shadow:0 0 20px #ffd78055}.primary{animation:textEnter .8s both,shine 3s 1s infinite}#previewName{animation:textEnter .6s both,goldGlow 3s infinite}#finalWish:not([hidden]){animation:textEnter 1.8s both,goldGlow 3s 1.8s infinite}#celebrate h2{animation:textEnter 1.2s both,goldGlow 3s infinite}#wishOut{animation:textEnter 1.2s .4s both}#again{z-index:2}#celebrate{background:linear-gradient(#07142699,transparent);border-radius:24px}canvas{z-index:0;pointer-events:none}main{position:relative;z-index:1}.panel{background:#08172cbd} @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
header[hidden]{display:none!important;}
@keyframes flameDance{0%,100%{transform:rotate(-5deg) scale(.94,1.04)}35%{transform:rotate(7deg) scale(1.07,.92)}70%{transform:rotate(-2deg) scale(.9,1.1)}}.flame{transform-box:fill-box;transform-origin:50% 65%;animation:flameDance .8s ease-in-out infinite}.choice svg{max-width:145px}#preview{width:190px}
.panel{background:#08172ca8;backdrop-filter:blur(5px)}
</style>
</head>
<body>
<canvas id="scene">
</canvas>
<main>
<header id="shopHeader">
<small>LOY KRATHONG • FESTIVAL OF LIGHT</small>
<h1>จ๊ะจ๋ากระทงซิ่ง</h1>
<p>ร้านกระทงออนไลน์ • ฝากความปรารถนาไว้กับสายน้ำและแสงจันทร์</p>
</header>
<section class="panel" id="setup">
<h2>๑. เลือกกระทงของคุณ</h2>
<div class="grid" id="choices">
</div>
<h2>๒. ฝากชื่อและคำอธิษฐาน</h2>
<div id="previewName">ชื่อของคุณ</div>
<div id="preview">
</div>
<form id="form">
<label for="name">ชื่อผู้ลอยกระทง</label>
<input id="name" maxlength="40" required placeholder="พิมพ์ชื่อของคุณ" autocomplete="off">
<label for="wish">คำอธิษฐาน (ไม่บังคับ)</label>
<textarea id="wish" maxlength="180" rows="2" placeholder="ขอให้สิ่งดี ๆ เกิดขึ้น...">
</textarea>
<button class="primary" type="submit">ลอยกระทง ✨</button>
</form>
</section>
<section id="celebrate">
<h2 id="greeting">
</h2>
<p id="wishOut">
</p>
<p id="finalWish" role="status" hidden>ขอให้มีความสุขในประเพณีลอยกระทงปีนี้ และตลอดไป 🎉</p>
<button id="again" class="primary">ลอยกระทงอีกครั้ง</button>
</section>
</main>
<script>
'use strict';const $=id=>document.getElementById(id);const types=[['ขนมปัง','#c17a35','#f8d58b'],['น้ำแข็ง','#64c9e9','#e2fbff'],['ต้นกล้วย','#286b42','#a8d36c'],['ดอกบัว','#b84786','#ffc1df'],['ดอกดาวเรือง','#c77913','#ffd548'],['กะลามะพร้าว','#633c28','#e0ad73'],['ดอกกล้วยไม้','#7547ad','#e3b8ff'],['พญานาค','#16735e','#f4d078']];let selected=2;
let artSerial=0;
function art(i){
 const [n,a,b]=types[i], id='k'+(++artSerial), u=x=>`url(#${id}${x})`;
 let defs=`<defs><linearGradient id="${id}base" x2="25%" y2="100%"><stop stop-color="${b}"/><stop offset=".48" stop-color="${a}"/><stop offset="1" stop-color="#211c26"/></linearGradient><linearGradient id="${id}petal" x2="70%" y2="100%"><stop stop-color="#fff5dc"/><stop offset=".25" stop-color="${b}"/><stop offset="1" stop-color="${a}"/></linearGradient><linearGradient id="${id}wax" ><stop stop-color="#c58a36"/><stop offset=".4" stop-color="#fff8c6"/><stop offset="1" stop-color="#e7b45c"/></linearGradient><radialGradient id="${id}halo"><stop stop-color="#fff3a0" stop-opacity=".65"/><stop offset=".35" stop-color="#ffac36" stop-opacity=".25"/><stop offset="1" stop-color="#ff8b20" stop-opacity="0"/></radialGradient><linearGradient id="${id}fire" x2="0%" y2="100%"><stop stop-color="#ff8c22"/><stop offset=".55" stop-color="#ffd85a"/><stop offset="1" stop-color="#fffde1"/></linearGradient></defs>`;
 let back='',front='',detail='';
 function petal(x,y,w,h,rot=0){return `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0 0 Q${-w} ${-h*.45} 0 ${-h} Q${w} ${-h*.45} 0 0Z" fill="${u('petal')}" stroke="${a}" stroke-width=".7"/><path d="M0 -2 Q-2 ${-h*.5} 0 ${-h+3}" fill="none" stroke="${b}" stroke-width=".8" opacity=".85"/></g>`;}
 function flower(x,y,r){let q='';for(let j=0;j<10;j++){let ang=j*Math.PI/5;q+=`<ellipse cx="${x+Math.cos(ang)*r*.65}" cy="${y+Math.sin(ang)*r*.65}" rx="${r*.55}" ry="${r*.38}" transform="rotate(${j*36} ${x+Math.cos(ang)*r*.65} ${y+Math.sin(ang)*r*.65})" fill="${u('petal')}" stroke="${a}" stroke-width=".45"/>`;}return q+`<circle cx="${x}" cy="${y}" r="${r*.33}" fill="#ffe48b"/>`;}
 for(let j=0;j<9;j++){let x=14+j*11.5,y=74-Math.sin(j*Math.PI/8)*8;
 if(i===0){back+=`<ellipse cx="${x}" cy="${y-9}" rx="12" ry="17" fill="${u('petal')}" stroke="#985224"/><path d="M${x-5} ${y-18}q5 -5 10 0" stroke="#fff0b4" fill="none"/>`;}
 else if(i===1){let h=20+j%3*7;back+=`<path d="M${x-8} ${y}l3 -${h} 10 -5 7 13 -3 ${h-8}Z" fill="${u('petal')}" stroke="#e6ffff" stroke-width=".8"/><path d="M${x-5} ${y-h}l8 10 -3 ${h-10}" fill="none" stroke="#fff" opacity=".8"/>`;}
 else if(i===4||i===6){back+=flower(x,y-10,i===4?10:12);}
 else if(i===5){if(j%2===0)back+=flower(x,y-8,8);}
 else {back+=petal(x,y,i===3?18:12,i===3?35:29,(j-4)*9);}
 }
 for(let j=0;j<11;j++){let x=10+j*10,y=82+Math.sin(j*Math.PI/10)*8;if(i===2||i===7||i===3)front+=petal(x,y,10,i===3?22:18,(j-5)*7);else if(i===4||i===6)front+=flower(x,y-5,7);else front+=`<path d="M${x-4} ${y-4}q4 5 8 0" fill="none" stroke="${b}" stroke-width="1.4"/>`;}
 if(i===7)detail=`<path d="M90 78 Q116 61 101 43 Q87 29 103 18 L113 24 104 30 Q98 35 110 48 Q125 68 100 83Z" fill="${u('base')}" stroke="#f4d078" stroke-width="2"/><path d="M100 20l-3 -9 10 7 5 -4 -1 9" fill="#f4d078"/><circle cx="106" cy="24" r="1.8" fill="#ffecb0"/><path d="M103 40q9 5 3 12m3 3q5 6 -2 12" fill="none" stroke="#f4d078"/>`;
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110">${defs}<ellipse cx="60" cy="92" rx="54" ry="8" fill="#000" opacity=".22"/><path d="M7 73 Q60 59 113 73 L106 87 Q60 110 14 87Z" fill="${u('base')}" stroke="${b}" stroke-width="1.2"/><ellipse cx="60" cy="73" rx="52" ry="14" fill="${a}" stroke="${b}"/>${back}${detail}<path d="M43 67L39 30M77 67L81 29" stroke="#d7a46d" stroke-width="1.7"/><path d="M39 30l-1 -5M81 29l1 -5" stroke="#ff8c45" stroke-width="2"/><rect x="54" y="37" width="12" height="34" rx="3" fill="${u('wax')}"/><path d="M56 39v14q2 4 3 0V39" fill="#fff6d1"/><ellipse cx="60" cy="37" rx="6" ry="2" fill="#fff4c1"/><path d="M60 38v-6" stroke="#463020" stroke-width="1.3"/><g class="flame"><ellipse cx="60" cy="26" rx="27" ry="30" fill="${u('halo')}"/><path d="M60 5 C62 17 73 22 66 31 C63 36 55 36 52 30 C47 22 58 15 60 5Z" fill="${u('fire')}"/><path d="M60 19 Q68 29 60 34 Q53 30 60 19Z" fill="#fffde8"/></g>${front}<path d="M12 88 Q60 108 108 88" fill="none" stroke="${b}" stroke-width="1.4" opacity=".8"/></svg>`;
}
const imgs=types.map((_,i)=>{let im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(art(i));return im});types.forEach((t,i)=>{let b=document.createElement('button');b.type='button';b.className='choice';b.innerHTML=art(i)+'<span>กระทง'+t[0]+'</span>';b.onclick=()=>choose(i);$('choices').append(b)});function choose(i){selected=i;[...$('choices').children].forEach((b,j)=>{b.classList.toggle('active',i===j);b.setAttribute('aria-pressed',i===j)});$('preview').innerHTML=art(i)}choose(2);$('name').oninput=()=>{$('previewName').textContent=$('name').value||'ชื่อของคุณ';};
const c=$('scene'),ctx=c.getContext('2d');let W,H,dpr,stars=[],particles=[],rockets=[],floating=false,start=0,lastFire=0,person='',last=0;const rand=(a,b)=>a+Math.random()*(b-a);function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:130},()=>[Math.random()*W,Math.random()*H*.55,rand(.4,1.8),rand(0,6.28)])}addEventListener('resize',resize);resize();function glow(x,y,r,color){let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}function burst(x,y,hue){for(let i=0;i<85;i++){let a=rand(0,Math.PI*2),v=rand(45,220);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(1.1,2.5),max:2.5,hue:hue+rand(-20,20),size:rand(1,3)})}}function launch(){rockets.push({x:rand(W*.12,W*.88),y:H*.65,tx:rand(W*.12,W*.88),ty:rand(H*.12,H*.45),age:0,hue:rand(0,360)})}

// Festival scenery: simulated visitors and their floating offerings.
const visitors=Array.from({length:12},(_,i)=>({side:i<6?-1:1,offset:(i%6)/6,phase:i*1.71,shirt:['#ad6479','#d5a56d','#568c91','#796eaa','#b75b48','#79985e'][i%6]}));
const offerings=Array.from({length:24},(_,i)=>({type:i%8,x:Math.random(),depth:Math.random(),speed:rand(.008,.024),phase:rand(0,6.28)}));
function line(x,y,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();}
function livingFlame(x,y,size,t,phase=0){let f=t*9+phase,dx=Math.sin(f)*size*.009, r=size*(.13+.025*Math.sin(f*1.7));glow(x+dx,y,r,'#ffad3855');ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle='#fff4b8';ctx.globalAlpha=.55+.25*Math.sin(f);ctx.beginPath();ctx.ellipse(x+dx,y,size*.012,size*.033,Math.sin(f)*.2,0,Math.PI*2);ctx.fill();ctx.restore();}
// Illuminated Thai temple fair on the opposite riverbank.
function templeFair(t){
 const s=Math.min(W/760,H/510), base=H*.555;
 const colors=['#ffce66','#ff729d','#70eaff','#a7ff92','#c9a0ff'];
 function bulb(x,y,i,r=2){let a=.55+.45*Math.pow(Math.sin(t*2.7+i*1.83),2),col=colors[i%5];ctx.save();ctx.globalAlpha=a;glow(x,y,r*5,col+'55');ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.restore();}
 function poly(p,fill,stroke){ctx.beginPath();p.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();}}
 ctx.save();ctx.translate(W*.38,base);ctx.scale(s,s);
 glow(0,-75,180,'#ffb43b22');
 // Golden chedi and its tiered spire.
 ctx.save();ctx.translate(-190,0);for(let i=0;i<4;i++){ctx.fillStyle=i%2?'#b77b32':'#e3ad55';ctx.fillRect(-42+i*6,-9-i*8,84-i*12,8);}
 ctx.beginPath();ctx.moveTo(-23,-33);ctx.bezierCurveTo(-42,-61,-14,-83,-8,-94);ctx.lineTo(8,-94);ctx.bezierCurveTo(14,-83,42,-61,23,-33);ctx.closePath();let g=ctx.createLinearGradient(-30,0,30,0);g.addColorStop(0,'#79501f');g.addColorStop(.5,'#ffe29a');g.addColorStop(1,'#a56a27');ctx.fillStyle=g;ctx.fill();for(let i=0;i<8;i++){ctx.fillStyle='#e9bd68';ctx.fillRect(-10+i*.9,-96-i*5,20-i*1.8,3);}poly([[-4,-134],[0,-158],[4,-134]],'#ffdf88');glow(0,-151,12,'#ffe6a766');ctx.restore();
 // Main ubosot: lit walls, columns, layered Thai gables and chofah finials.
 ctx.fillStyle='#c7a477';ctx.fillRect(-104,-79,208,76);ctx.fillStyle='#775238';ctx.fillRect(-112,-8,224,8);
 for(let i=-84;i<=84;i+=42){ctx.fillStyle='#704327';ctx.fillRect(i-9,-63,18,47);ctx.fillStyle='#ffcb65';ctx.fillRect(i-5,-57,10,29);glow(i,-42,19,'#ffb74355');ctx.fillStyle='#f4d69a';ctx.fillRect(i+15,-73,5,67);}
 for(let k=0;k<3;k++){let y=-70-k*27,w=126-k*22;poly([[-w,y],[0,y-58],[w,y],[w-12,y+9],[0,y-39],[-w+12,y+9]],'#702b35','#f4bd57');poly([[-w+15,y-3],[0,y-48],[w-15,y-3]],'#9e4935','#e5a94d');for(let i=0;i<=20;i++){let x=-w+i*w/10;bulb(x,y-58*(1-Math.abs(x)/w),i+k*3,1.5);}line(-w,y,-w-5,y-13,'#ffce70',2);line(w,y,w+5,y-13,'#ffce70',2);line(0,y-58,4,y-73,'#ffda85',2);}
 ctx.restore();
 // Fair stalls, strings of multicolored lights, and water reflections.
 for(let j=0;j<7;j++){let x=W*(.045+j*.15),w=Math.min(65,W*.11),y=base-3;ctx.fillStyle='#392c36';ctx.fillRect(x-w/2,y-20,w,20);poly([[x-w*.65,y-20],[x,y-39],[x+w*.65,y-20]],['#a84460','#326f85','#b27b37'][j%3]);ctx.fillStyle='#ffce78';ctx.fillRect(x-w*.35,y-16,w*.7,11);for(let k=0;k<5;k++)bulb(x-w*.5+k*w/4,y-20,j+k,1.6);}
 for(let j=0;j<Math.ceil(W/13);j++){let x=j*13,y=base-45+15*Math.sin(x/Math.max(30,W/9)*Math.PI);bulb(x,y,j,2);let col=colors[j%5];ctx.save();ctx.globalAlpha=.13+.07*Math.sin(t*2+j);for(let k=0;k<5;k++){let yy=base+12+k*8;line(x+Math.sin(t*2+k+j)*5-3,yy,x+Math.sin(t*2+k+j)*5+3+k,yy,col,1.5);}ctx.restore();}
}

function festival(t){
 // Far-bank lantern garland.
 for(let j=0;j<Math.ceil(W/32);j++){let x=j*32,y=H*.535+Math.sin(j*.4)*5;glow(x,y,13,'#ffc56b44');ctx.fillStyle='#e8ad59';ctx.fillRect(x-2,y-3,4,6);}
 // Two sloping riverbanks, leaving the central river open.
 for(const side of [-1,1]){ctx.save();if(side===1){ctx.translate(W,0);ctx.scale(-1,1)}ctx.fillStyle='#172b2b';ctx.beginPath();ctx.moveTo(0,H*.62);ctx.quadraticCurveTo(W*.12,H*.78,W*.22,H);ctx.lineTo(0,H);ctx.fill();ctx.strokeStyle='#b59b6255';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,H*.62);ctx.quadraticCurveTo(W*.12,H*.78,W*.22,H);ctx.stroke();ctx.restore();}
 for(const v of visitors){let d=v.offset,scale=.45+d*.65,x=(.018+d*.13)*W;if(v.side===1)x=W-x;let y=H*(.65+d*.31),dir=-v.side,bend=(1+Math.sin(t*.85+v.phase))/2;ctx.save();ctx.translate(x,y);ctx.scale(dir*scale,scale);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,0,22,6,0,0,7);ctx.fill();line(-5,-24,-12,-2,'#172032',9);line(5,-24,15,-2,'#222b3c',9);let hx=9+bend*13,hy=-58+bend*16;line(0,-25,hx-4,hy+13,v.shirt,19);line(hx-4,hy+15,hx+13,hy+25,'#c68e70',6);line(hx+13,hy+25,hx+24,hy+27+bend*9,'#d6a080',5);ctx.fillStyle='#d7a17d';ctx.beginPath();ctx.arc(hx,hy,9,0,7);ctx.fill();ctx.fillStyle='#22202b';ctx.beginPath();ctx.arc(hx-2,hy-3,9,Math.PI,Math.PI*2);ctx.fill();let im=imgs[Math.floor(v.phase)%8];if(im.complete&&im.naturalWidth){let ky=hy+20+bend*9;glow(hx+28,ky,17,'#ffb84444');ctx.drawImage(im,hx+14,ky-13,28,28)}ctx.restore();}
 for(const o of offerings){let d=(o.depth+t*o.speed)%1,x=W*(.23+.54*((o.x+t*.004)%1))+Math.sin(t*.7+o.phase)*8,y=H*(.59+d*.39)+Math.sin(t*1.6+o.phase)*2,size=13+d*Math.min(48,W*.09),im=imgs[o.type];if(!im.complete||!im.naturalWidth)continue;glow(x,y-size*.15,size*.85,'#ffc05235');ctx.save();ctx.globalAlpha=.19;ctx.translate(x,y+size*.13);ctx.scale(1,-.32);ctx.drawImage(im,-size/2,-size*.5,size,size);ctx.restore();ctx.drawImage(im,x-size/2,y-size*.78,size,size);livingFlame(x,y-size*.78+size*26/110,size,t,o.phase);}
 ctx.lineWidth=1;
}


// Small distant sky lanterns, drifting continuously above the temple fair.
const skyLanterns = Array.from({length: 28}, (_, i) => ({
  x: ((i * .61803398875 + .09) % 1),
  phase: (i * .381966) % 1,
  speed: .006 + (i % 5) * .0015,
  size: 3 + (i % 7) * .85,
  sway: i * 2.39
}));
function drawSkyLanterns(t) {
  for (const l of skyLanterns) {
    const p = (l.phase + t * l.speed) % 1;
    const y = H * (.43 - p * .48);
    const x = W * l.x + Math.sin(t * .28 + l.sway) * 12 + p * 18;
    const w = l.size * Math.max(.65, Math.min(1.2, W / 650)) * (1 - p * .35);
    const h = w * 1.55;
    const fade = Math.min(1, p * 12, (1-p)*10);
    if (y < -h) continue;
    ctx.save();
    ctx.globalAlpha = fade * (.75 + .2 * Math.sin(t * 3 + l.sway));
    glow(x, y, w * 3.5, '#ffad4244');
    ctx.translate(x,y);
    ctx.rotate(Math.sin(t * .6 + l.sway) * .09);
    const paper = ctx.createLinearGradient(-w/2,0,w/2,h/2);
    paper.addColorStop(0,'#b64a20');
    paper.addColorStop(.32,'#ffb65b');
    paper.addColorStop(.65,'#ffe1a0');
    paper.addColorStop(1,'#d86b28');
    ctx.fillStyle = paper;
    ctx.beginPath();
    ctx.moveTo(-w*.38,-h*.5);
    ctx.quadraticCurveTo(0,-h*.62,w*.38,-h*.5);
    ctx.quadraticCurveTo(w*.6,0,w*.39,h*.45);
    ctx.quadraticCurveTo(0,h*.58,-w*.39,h*.45);
    ctx.quadraticCurveTo(-w*.6,0,-w*.38,-h*.5);
    ctx.fill();
    ctx.fillStyle='#8f431f';
    ctx.beginPath();ctx.ellipse(0,h*.45,w*.39,w*.13,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff1b0';
    ctx.beginPath();ctx.ellipse(0,h*.37,w*.15,w*.22,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function frame(ms){let t=ms/1000,dt=Math.min(.04,t-last||.016);last=t;let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#03091c');sky.addColorStop(.55,'#20354e');sky.addColorStop(.56,'#102a40');sky.addColorStop(1,'#030e20');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);for(let [x,y,r,p] of stars){ctx.globalAlpha=.45+.4*Math.sin(t*1.5+p);ctx.fillStyle='#fff5dc';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}ctx.globalAlpha=1;let mx=W*.77,my=H*.18,mr=Math.min(W,H)*.065;glow(mx,my,mr*3,'#ffe6a94a');ctx.fillStyle='#fff1c8';ctx.beginPath();ctx.arc(mx,my,mr,0,7);ctx.fill();drawSkyLanterns(t);ctx.fillStyle='#0b1728';ctx.beginPath();ctx.moveTo(0,H*.56);for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,H*.55-18*Math.abs(Math.sin(x*.012))-12*Math.abs(Math.cos(x*.037)));ctx.lineTo(W,H*.58);ctx.lineTo(0,H*.58);ctx.fill();for(let j=0;j<95;j++){let y=H*.57+j*H*.0047,x=mx+Math.sin(j*7.1+t)*W*.08,len=(8+j*.7)*(1+.5*Math.sin(j+t*2));ctx.strokeStyle=`rgba(255,222,151,${.04+.12*(1-j/95)})`;ctx.beginPath();ctx.moveTo(x-len,y);ctx.lineTo(x+len,y);ctx.stroke()}for(let j=0;j<45;j++){let y=H*.58+j*H*.01,x=(j*137+t*9)%W;ctx.strokeStyle='#9bc8e51b';ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+35,y+3,x+80,y);ctx.stroke()}
templeFair(t);
festival(t);
if(floating){let elapsed=t-start,p=Math.min(1,elapsed/16),size=Math.min(230,W*.46)*(1-.62*p),x=W*.5+Math.sin(p*3)*W*.13,y=H*(.86-.27*p)+Math.sin(t*2)*3;glow(x,y,size*.7,'#ffb43b33');ctx.save();ctx.globalAlpha=.17;ctx.translate(x,y+size*.28);ctx.scale(1,-.35);if(imgs[selected].complete&&imgs[selected].naturalWidth)ctx.drawImage(imgs[selected],-size/2,-size*.5,size,size);ctx.restore();if(imgs[selected].complete&&imgs[selected].naturalWidth)ctx.drawImage(imgs[selected],x-size/2,y-size*.75,size,size);livingFlame(x,y-size*.75+size*26/110,size,t);ctx.font=`bold ${Math.max(14,size*.09)}px Tahoma`;ctx.textAlign='center';ctx.fillStyle='#fff2c3';ctx.shadowColor='#000';ctx.shadowBlur=8;ctx.fillText(person,x,y-size*.77+Math.sin(t*2)*2,W*.85);ctx.shadowBlur=0;if(elapsed>=27&&$('finalWish').hidden){$('finalWish').hidden=false;for(let j=0;j<5;j++)burst(W*(.15+j*.175),H*(.22+.08*Math.sin(j)),45+j*65);}if(elapsed<24&&t-lastFire>.55){launch();lastFire=t}}
for(let r of rockets){r.age+=dt;let q=Math.min(1,r.age/.85),x=r.x+(r.tx-r.x)*q,y=r.y+(r.ty-r.y)*q;glow(x,y,12,'#fff2bbaa');ctx.strokeStyle='#ffe4a8';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-(r.tx-r.x)*.04,y-(r.ty-r.y)*.04);ctx.stroke();if(q===1)burst(x,y,r.hue)}rockets=rockets.filter(r=>r.age<.85);ctx.globalCompositeOperation='lighter';for(let p of particles){p.life-=dt;p.vy+=65*dt;p.vx*=Math.pow(.65,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.strokeStyle=`hsla(${p.hue},100%,70%,${Math.max(0,p.life/p.max)})`;ctx.lineWidth=p.size;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);ctx.stroke()}ctx.globalCompositeOperation='source-over';ctx.lineWidth=1;particles=particles.filter(p=>p.life>0);requestAnimationFrame(frame)}requestAnimationFrame(frame);
$('form').onsubmit=e=>{e.preventDefault();person=$('name').value.trim();if(!person){$('name').focus();return} $('shopHeader').hidden=true;$('setup').style.display='none';$('celebrate').style.display='block';$('greeting').textContent='สุขสันต์วันลอยกระทง '+person;$('wishOut').textContent=$('wish').value.trim();$('finalWish').hidden=true;floating=true;start=last;lastFire=last-1;launch();window.scrollTo(0,0)};$('again').onclick=()=>{$('shopHeader').hidden=false;floating=false;$('finalWish').hidden=true;particles=[];rockets=[];$('celebrate').style.display='none';$('setup').style.display='block';window.scrollTo(0,0)};
