<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Love Letter ♡</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;overflow:hidden;display:grid;place-items:center;font-family:"Courier New",monospace;background:linear-gradient(135deg,#fff3ee,#ffe3e5,#fff8f3);color:#442c34}
.bg{position:fixed;color:#e86d88;opacity:.45;animation:float 3s ease-in-out infinite alternate;pointer-events:none}
@keyframes float{to{transform:translateY(-18px) rotate(12deg) scale(1.15)}}
.window{width:min(430px,90vw);border:3px solid #df6f86;border-radius:9px;background:#ffd6de;box-shadow:0 16px 40px #6e30452d;overflow:hidden;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.bar{height:48px;background:#ffc4cf;border-bottom:3px solid #df6f86;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:bold}
.controls{display:flex;gap:7px}.controls i{width:17px;height:17px;border:2px solid #df6f86;background:white;font-style:normal;font-size:10px;text-align:center}
.content{height:350px;position:relative;text-align:center;padding:18px;background:linear-gradient(#ffffff33,#ffffff33),repeating-linear-gradient(0deg,transparent 0 18px,#df6f8620 19px 20px),repeating-linear-gradient(90deg,transparent 0 18px,#df6f8620 19px 20px)}
.hearts{color:#e94f70;letter-spacing:12px;animation:pulse .9s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
h1{font-size:21px;line-height:1.35;margin:14px 0 10px;animation:text 2s ease-in-out infinite}
@keyframes text{50%{transform:translateY(-3px)}}
.cat{font-size:76px;margin:10px 0;animation:cat 1.4s ease-in-out infinite}
@keyframes cat{50%{transform:translateY(-7px) rotate(3deg)}}
#yes,#no{font:bold 18px "Courier New";padding:11px 18px;min-width:88px;border:3px solid #df6f86;background:#fff9f8;color:#8e4050;box-shadow:3px 3px #e98ca0;touch-action:none;-webkit-user-select:none;user-select:none}
#yes{position:absolute;left:calc(50% - 115px);bottom:30px;animation:yes 1.2s ease-in-out infinite}
@keyframes yes{50%{transform:scale(1.07)}}
#no{position:absolute;left:calc(50% + 25px);bottom:30px;z-index:99;transition:left .10s ease,top .10s ease,transform .10s ease}
.success{display:none;padding-top:35px}.won .question{display:none}.won .success{display:block}.big{font-size:90px;animation:pulse .65s ease-in-out infinite alternate}
.fly{position:fixed;z-index:999;pointer-events:none;color:#e94f70;font-size:25px;animation:fly 2s ease-out forwards}
@keyframes fly{to{opacity:0;transform:translateY(-190px) rotate(25deg) scale(1.4)}}
</style>
</head>
<body>
<span class="bg" style="left:8%;top:18%">♥</span><span class="bg" style="right:9%;top:28%;animation-delay:1s">♡</span>
<span class="bg" style="left:15%;bottom:15%;animation-delay:2s">♥</span><span class="bg" style="right:14%;bottom:12%;animation-delay:3s">♡</span>

<div class="window" id="win">
 <div class="bar"><span>LOVE ♡</span><div class="controls"><i>–</i><i>□</i><i>×</i></div></div>
 <div class="content" id="area">
  <div class="question">
   <div class="hearts">♥ ♥ ♥ ♥</div>
   <h1>ญาณิศา รัก หัสสกรณ์มั๊ย ? ♡</h1>
   <div class="cat">🐈‍⬛❤️</div>
   <button id="yes">YES</button><button id="no">NO</button>
  </div>
  <div class="success"><div class="hearts">♥ ♥ ♥ ♥</div><h1>หัสสกรณ์ก็รักญาณิศา ♡</h1><div class="big">💗</div><p>รักนะ ❤️</p></div>
 </div>
</div>

<script>
const area=document.getElementById("area"), no=document.getElementById("no"), yes=document.getElementById("yes"), win=document.getElementById("win");
function moveNo(){
 const a=area.getBoundingClientRect(), b=no.getBoundingClientRect(), pad=10;
 const maxX=a.width-b.width-pad*2, maxY=a.height-b.height-pad*2;
 let x=pad+Math.random()*maxX, y=pad+Math.random()*maxY;
 // Keep NO away from YES area near bottom-left.
 if(y>a.height-100 && x<a.width/2+40) y=20+Math.random()*100;
 no.style.left=x+"px"; no.style.top=y+"px"; no.style.bottom="auto";
 no.style.transform="rotate("+(Math.random()*16-8)+"deg)";
}
["pointerdown","touchstart","mousedown","click"].forEach(evt=>{
 no.addEventListener(evt,e=>{e.preventDefault();e.stopPropagation();moveNo();},{passive:false});
});
no.addEventListener("mouseenter",moveNo);
no.addEventListener("mouseover",moveNo);

yes.addEventListener("click",()=>{
 win.classList.add("won");
 for(let i=0;i<32;i++){let h=document.createElement("span");h.className="fly";h.textContent=i%2?"♥":"♡";h.style.left=(5+Math.random()*90)+"vw";h.style.top=(65+Math.random()*30)+"vh";h.style.animationDelay=(Math.random()*.6)+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),2600)}
});
</script>
</body>
</html>
