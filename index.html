<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17132b"><title>ญาณิศา ตู้คีบ — เกมคีบตุ๊กตา</title><style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap');*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Kanit,system-ui,sans-serif;color:#fff}body{background:radial-gradient(ellipse at 50% 0%,#57436d 0%,#251e3d 43%,#141225 100%);display:flex;align-items:center;justify-content:center;padding:20px 12px 28px;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:55px 65px}.app{width:min(100%,490px);position:relative}.top{text-align:center;margin-bottom:12px}.eyebrow{font-size:11px;letter-spacing:4px;color:#f8c8e4}.top h1{font-size:clamp(27px,7vw,37px);line-height:1.15;margin:4px 0 5px;font-weight:700;letter-spacing:1px;background:linear-gradient(90deg,#fff,#ffbde0,#d8c6ff);color:transparent;background-clip:text}.subtitle{font-size:12px;color:#d4c8e5}.stats{display:flex;gap:9px;margin:14px 0}.stat{flex:1;background:#ffffff10;border:1px solid #ffffff24;border-radius:15px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;box-shadow:inset 0 1px #ffffff12}.stat span{font-size:12px;color:#d9cde7}.stat strong{font-size:20px;color:#fff}.machine{position:relative;border-radius:27px 27px 22px 22px;padding:12px 13px 17px;background:linear-gradient(110deg,#ff9bc5,#ff6fac 35%,#e86ca9 70%,#b55b9e);box-shadow:0 20px 50px #09061399,inset 3px 3px #ffffff66,inset -4px -4px #712b6b70;border:3px solid #ffbbda}.marquee{height:44px;border-radius:17px 17px 9px 9px;background:linear-gradient(#fff5ff,#ffdaef);display:flex;align-items:center;justify-content:center;color:#9e4a8c;letter-spacing:3px;font-weight:700;font-size:17px;text-shadow:0 1px white;box-shadow:inset 0 -3px #edb1d5}.bulb{width:9px;height:9px;border-radius:50%;background:#fff9bd;box-shadow:0 0 10px #fff4b0;position:absolute;top:30px;animation:twinkle 1.5s infinite alternate}.bulb.left{left:24px}.bulb.right{right:24px;animation-delay:.7s}@keyframes twinkle{to{opacity:.45}}.glass{margin-top:10px;border-radius:12px;overflow:hidden;border:6px solid #ffdcf0;box-shadow:inset 0 0 25px #fff8,0 5px 0 #bb498b;background:#b6d9e6;position:relative}.glass canvas{width:100%;height:auto;display:block;touch-action:none}.panel{margin-top:14px;background:linear-gradient(130deg,#ffdaee,#f7a7d0);border:3px solid #ffe6f4;border-radius:17px;padding:12px;box-shadow:inset 0 -4px #dc77b2}.paneltop{display:flex;align-items:center;justify-content:space-between;color:#9c447f;font-size:12px;font-weight:600;margin-bottom:9px}.pill{background:#fff8ff;border-radius:20px;padding:3px 10px;color:#a64a88}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:9px}.ctrl{border:0;border-radius:15px;min-height:57px;background:linear-gradient(#fff,#ffe7f4);color:#ae4a88;font:700 20px Kanit,system-ui;box-shadow:0 5px 0 #d38caf,0 8px 12px #7a306133;touch-action:none;user-select:none;cursor:pointer}.ctrl:active,.ctrl.active{transform:translateY(4px);box-shadow:0 1px 0 #d38caf}.ctrl.drop{font-size:16px;background:linear-gradient(#9e7af9,#7557da);color:white;box-shadow:0 5px 0 #5644a0,0 8px 12px #7a306133}.ctrl.drop:active{box-shadow:0 1px 0 #5644a0}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:15px;gap:10px}.hint{font-size:11px;color:#d8cbe5;line-height:1.6}.secondary{background:#ffffff15;border:1px solid #ffffff35;border-radius:12px;color:#f6e7ff;padding:8px 12px;font:500 12px Kanit;cursor:pointer}.message{min-height:30px;text-align:center;font-size:13px;color:#ffe8fa;margin:11px 0 0}.collection{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-height:29px;margin-top:5px}.prize{background:#ffffff24;border:1px solid #ffffff44;border-radius:9px;padding:2px 7px;font-size:20px}.overlay{position:fixed;inset:0;background:#130d26b8;display:none;align-items:center;justify-content:center;padding:22px;z-index:5;backdrop-filter:blur(5px)}.overlay.show{display:flex}.modal{background:linear-gradient(145deg,#fff3fa,#f6e8ff);color:#70416e;text-align:center;padding:28px 25px;border-radius:26px;width:min(100%,340px);box-shadow:0 25px 70px #0008}.modal .big{font-size:75px;animation:pop .5s both}@keyframes pop{from{transform:scale(.4) rotate(-20deg)}to{transform:scale(1)}}.modal h2{margin:4px 0;font-size:24px}.modal p{font-size:14px}.modal button{background:#9169eb;color:white;border:0;border-radius:13px;padding:12px 24px;font:600 14px Kanit;cursor:pointer}.sparkle{position:absolute;color:#fff;pointer-events:none;animation:float 3s ease-in-out infinite}.sparkle.a{top:60px;left:-10px}.sparkle.b{top:120px;right:-13px;animation-delay:1s}@keyframes float{50%{transform:translateY(-12px)}}@media(max-width:370px){.machine{padding:9px}.controls{gap:6px}.ctrl{min-height:51px}.panel{padding:9px}.marquee{font-size:14px}}@media(min-height:900px){body{align-items:center}}

/* Refined animated arcade interface */
.top{animation:headerEntrance .8s cubic-bezier(.2,.8,.2,1) both}
.top h1{font-size:clamp(29px,7.5vw,41px);background:linear-gradient(110deg,#fff 5%,#ffc5e7 26%,#e1c6ff 45%,#fff 58%,#ffb7dc 80%,#fff 100%);background-size:250% auto;background-clip:text;-webkit-background-clip:text;color:transparent;animation:titleShimmer 5s linear infinite,headerFloat 4s ease-in-out infinite;filter:drop-shadow(0 2px 12px #ffaddb44)}
.subtitle{font-size:14px;animation:fadeRise .8s .18s both}
.credit{font-size:10px;letter-spacing:1.2px;color:#c9b9d7;margin-top:6px;opacity:.8;animation:fadeRise .8s .35s both}
@keyframes titleShimmer{to{background-position:250% center}}
@keyframes headerFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes headerEntrance{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.stats{animation:fadeRise .7s .3s both}.stat{transition:transform .25s,box-shadow .25s,border-color .25s}.stat:hover{transform:translateY(-3px);border-color:#ffd6f366;box-shadow:0 7px 20px #ffb0de1b}
.machine{animation:machineEnter .85s .15s both;transition:box-shadow .3s}
@keyframes machineEnter{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.marquee{background-size:200% 100%;animation:marqueeGlow 3s ease-in-out infinite alternate}
@keyframes marqueeGlow{to{box-shadow:inset 0 -3px #edb1d5,0 0 18px #fff7}}
.ctrl{position:relative;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease,filter .2s ease}
.ctrl::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,#ffffff88 48%,transparent 75%);transform:translateX(-160%);pointer-events:none}
.ctrl:hover::after{animation:buttonSweep .7s ease-out}.ctrl:hover{filter:brightness(1.06)}
@keyframes buttonSweep{to{transform:translateX(160%)}}
.ctrl.drop{animation:dropGlow 2.8s ease-in-out infinite}
@keyframes dropGlow{0%,100%{filter:drop-shadow(0 0 0 #c2a2ff00)}50%{filter:drop-shadow(0 0 9px #c2a2ff99)}}
.ctrl:active,.ctrl.active{animation:none;transform:translateY(4px) scale(.96)}
.secondary,.modal button{transition:transform .18s,background .2s,box-shadow .2s}.secondary:hover,.modal button:hover{transform:translateY(-2px);box-shadow:0 5px 14px #0003}.secondary:active,.modal button:active{transform:scale(.95)}
.overlay.show .modal{animation:modalIn .38s cubic-bezier(.2,1.3,.3,1) both}
@keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(.82)}to{opacity:1;transform:translateY(0) scale(1)}}
.prize{animation:prizeIn .4s cubic-bezier(.2,1.3,.3,1) both}
@keyframes prizeIn{from{opacity:0;transform:scale(.4) rotate(-20deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.message{transition:color .2s}.ctrl:focus-visible,.secondary:focus-visible,.modal button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(hover:none){.ctrl:hover::after{animation:none}.ctrl:hover{filter:none}}
@media(prefers-reduced-motion:reduce){.top,.top h1,.subtitle,.credit,.stats,.machine,.marquee,.ctrl.drop,.sparkle,.bulb,.prize,.overlay.show .modal{animation:none!important}*,*::before,*::after{transition:none!important}}
</style></head><body><main class="app"><span class="sparkle a">✦</span><span class="sparkle b">✧</span><header class="top"><h1>ญาณิศา ตู้คีบ</h1><div class="subtitle">ขอให้สนุกกับการคีบตุ๊กตา</div><div class="credit">Create by Hussakorn</div></header><section class="stats"><div class="stat"><span>🪙 เหรียญ</span><strong id="coins">10</strong></div><div class="stat"><span>🏆 คีบสำเร็จ</span><strong id="wins">0</strong></div><div class="stat"><span>🎯 โอกาสคีบ</span><strong id="tries">0</strong></div></section><div class="machine"><div class="bulb left"></div><div class="bulb right"></div><div class="marquee">✧ ญาณิศา ตู้คีบ ✧</div><div class="glass"><canvas id="game" width="420" height="405" aria-label="เกมคีบตุ๊กตา"></canvas></div><div class="panel"><div class="paneltop"><span>🎮 CONTROL PANEL</span><span class="pill" id="status">พร้อมเล่น!</span></div><div class="controls"><button class="ctrl" id="left" aria-label="เลื่อนซ้าย">◀</button><button class="ctrl" id="right" aria-label="เลื่อนขวา">▶</button><button class="ctrl drop" id="drop">✦ คีบเลย!</button></div></div></div><div class="message" id="message" aria-live="polite">เลื่อนหัวคีบให้ตรงกับตุ๊กตา แล้วกดคีบ!</div><div class="collection" id="collection"></div><div class="bottom"><div class="hint">⌨️ คอมพิวเตอร์: ← → และ Space<br>📱 มือถือ: กดปุ่มซ้าย–ขวาค้างเพื่อเลื่อน</div><button class="secondary" id="reset">↻ เริ่มใหม่</button></div></main><div class="overlay" id="overlay"><div class="modal"><div class="big" id="resultEmoji">🧸</div><h2 id="resultTitle">เยี่ยมมาก!</h2><p id="resultText">คุณได้รับตุ๊กตาแล้ว</p><button id="continue">เล่นต่อ ✦</button></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const $=id=>document.getElementById(id);const W=420,H=405,ground=344,types=[{emoji:'🐻',color:'#d6a374',name:'น้องหมี'},{emoji:'🐰',color:'#fff0f4',name:'น้องกระต่าย'},{emoji:'🐱',color:'#f4c9a6',name:'น้องแมว'},{emoji:'🐼',color:'#e9e9f0',name:'น้องแพนด้า'},{emoji:'🐸',color:'#a8dbac',name:'น้องกบ'},{emoji:'🐷',color:'#ffb5c9',name:'น้องหมู'},{emoji:'🦊',color:'#f2b879',name:'น้องจิ้งจอก'},{emoji:'🐨',color:'#bcc4dc',name:'น้องโคอาล่า'}];let toys=[],coins=10,wins=0,tries=0,x=210,y=63,phase='idle',phaseTime=0,targetY=285,grabbed=null,move=0,last=0,shake=0;const rand=(a,b)=>a+Math.random()*(b-a);function populate(){toys=[];for(let row=0;row<2;row++)for(let i=0;i<5;i++){let t=types[(i*3+row*2)%types.length];toys.push({...t,x:56+i*77+rand(-9,9),y:ground-27-row*49+rand(-5,5),size:36,tilt:rand(-.18,.18),taken:false})}}function stats(){$('coins').textContent=coins;$('wins').textContent=wins;$('tries').textContent=tries}function msg(s){$('message').textContent=s}function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();if(ctx.roundRect){ctx.roundRect(x,y,w,h,r)}else{ctx.rect(x,y,w,h)}ctx.fill()}function toy(t){ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.tilt||0);let s=t.size;ctx.fillStyle='#51395426';ctx.beginPath();ctx.ellipse(0,s*.92,s*.8,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=t.color;ctx.beginPath();ctx.ellipse(-s*.53,-s*.58,s*.28,s*.35,0,0,7);ctx.ellipse(s*.53,-s*.58,s*.28,s*.35,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(0,s*.35,s*.63,s*.63,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(0,-s*.35,s*.77,0,7);ctx.fill();ctx.fillStyle='#41334c';ctx.beginPath();ctx.arc(-s*.26,-s*.4,2.7,0,7);ctx.arc(s*.26,-s*.4,2.7,0,7);ctx.fill();ctx.fillStyle='#e889a8';ctx.beginPath();ctx.ellipse(0,-s*.12,5,3.5,0,0,7);ctx.fill();ctx.fillStyle='#fff9';ctx.beginPath();ctx.arc(-s*.43,-s*.19,4,0,7);ctx.arc(s*.43,-s*.19,4,0,7);ctx.fill();ctx.font='42px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.emoji,0,-s*.12);ctx.textAlign='start';ctx.textBaseline='alphabetic';ctx.restore()}function draw(time){let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#c8eaf1');grad.addColorStop(.75,'#f6d5e8');grad.addColorStop(1,'#eab1ce');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff45';ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(75,0);ctx.lineTo(0,250);ctx.lineTo(0,100);ctx.fill();for(let i=0;i<18;i++){let px=(i*73+30)%W,py=(i*89+42)%295;ctx.fillStyle=i%3===0?'#fff9':'#ffffff55';ctx.font=(i%3===0?19:12)+'px sans-serif';ctx.fillText(i%2?'✦':'✧',px,py)}roundRect(0,ground-6,W,68,0,'#edb4d4');roundRect(0,ground-6,W,10,0,'#fff0f7');roundRect(8,ground+8,95,51,9,'#a767a6');roundRect(18,ground+14,75,35,6,'#65466f');ctx.font='11px Kanit';ctx.fillStyle='#fff';ctx.fillText('PRIZE ↓',34,ground+33);for(let t of toys)if(!t.taken&&t!==grabbed)toy(t);ctx.strokeStyle='#8a6a9d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,y);ctx.stroke();roundRect(x-28,y-8,56,22,9,'#a68cc6');roundRect(x-22,y-5,44,12,6,'#e8d8f5');ctx.strokeStyle='#76608e';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-12,y+11);ctx.lineTo(x-22,y+32);ctx.lineTo(x-15,y+43);ctx.moveTo(x+12,y+11);ctx.lineTo(x+22,y+32);ctx.lineTo(x+15,y+43);ctx.stroke();if(grabbed){grabbed.x=x;grabbed.y=y+73;grabbed.tilt=Math.sin(time/130)*.09;toy(grabbed)}ctx.fillStyle='#ffffff44';ctx.fillRect(W-9,0,9,H);if(shake>0){shake*=.88;if(shake<.1)shake=0}}function result(win,t){$('overlay').classList.add('show');$('resultEmoji').textContent=win?t.emoji:'💫';$('resultTitle').textContent=win?'คีบสำเร็จ!':'เกือบแล้ว!';$('resultText').textContent=win?'คุณได้รับ'+t.name+'เข้าคอลเลกชัน ♡':'ตุ๊กตาหลุดไป ลองอีกครั้งนะ!';$('continue').textContent=coins>0?'เล่นต่อ ✦':'เติมเหรียญแล้วเล่นต่อ ✦';$('status').textContent=win?'WINNER!':'ลองอีกครั้ง'}function startDrop(){if(phase!=='idle'||coins<=0)return;coins--;tries++;stats();phase='down';phaseTime=0;move=0;targetY=ground-104;msg('กำลังหย่อนหัวคีบ… ✨');$('status').textContent='กำลังคีบ…'}function step(dt){if(phase==='idle'){x=Math.max(36,Math.min(W-36,x+move*dt*.23));return}phaseTime+=dt;if(phase==='down'){y=Math.min(targetY,y+dt*.23);if(y>=targetY){phase='grab';phaseTime=0;let candidates=toys.filter(t=>!t.taken).map(t=>({t,d:Math.abs(t.x-x)+Math.abs(t.y-(y+73))*.12})).sort((a,b)=>a.d-b.d);let c=candidates[0];if(c&&Math.abs(c.t.x-x)<30&&Math.random()<.78){grabbed=c.t;msg('จับได้แล้ว! กำลังยกขึ้น…')}else msg('อุ๊ปส์! ลองลุ้นอีกนิด…')}}else if(phase==='grab'){if(phaseTime>550){phase='up';phaseTime=0}}else if(phase==='up'){y=Math.max(63,y-dt*.27);if(y<=63){phase='return';phaseTime=0}}else if(phase==='return'){x=Math.max(55,x-dt*.25);if(x<=55){phase='release';phaseTime=0}}else if(phase==='release'){if(phaseTime>400){let won=!!grabbed,t=grabbed;if(won){t.taken=true;wins++;const badge=document.createElement('span');badge.className='prize';badge.textContent=t.emoji;badge.title=t.name;$('collection').appendChild(badge)}grabbed=null;phase='idle';x=210;y=63;stats();result(won,t);if(toys.every(t=>t.taken))populate();if(coins===0)msg('เหรียญหมดแล้ว กดเติมเหรียญเพื่อเล่นต่อ');else msg(won?'สุดยอด! คีบตัวต่อไปกันเลย ✨':'ลองขยับให้ตรงกลางตุ๊กตามากขึ้นนะ')}}}function frame(t){let dt=Math.min(t-last||16,45);last=t;step(dt);draw(t);requestAnimationFrame(frame)}function setMove(dir){if(phase==='idle')move=dir}for(let [id,dir] of [['left',-1],['right',1]]){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);setMove(dir);b.classList.add('active')});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{move=0;b.classList.remove('active')})}window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.repeat&&e.code==='Space')return;if(e.code==='ArrowLeft')setMove(-1);if(e.code==='ArrowRight')setMove(1);if(e.code==='Space')startDrop()});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'&&move===-1||e.code==='ArrowRight'&&move===1)move=0});window.addEventListener('blur',()=>move=0);$('drop').addEventListener('click',startDrop);$('continue').addEventListener('click',()=>{$('overlay').classList.remove('show');if(coins===0){coins=10;stats();msg('เติมเหรียญให้แล้ว! มาเล่นต่อกัน ✨')}$('status').textContent='พร้อมเล่น!'});$('reset').addEventListener('click',()=>{if(phase!=='idle')return;if(!confirm('เริ่มเกมใหม่และล้างคอลเลกชันทั้งหมด?'))return;coins=10;wins=tries=0;grabbed=null;x=210;y=63;populate();$('collection').replaceChildren();$('overlay').classList.remove('show');$('status').textContent='พร้อมเล่น!';msg('เริ่มใหม่แล้ว! เลือกตุ๊กตาที่ชอบได้เลย');stats()});populate();stats();requestAnimationFrame(frame)})();
</script></body></html>
